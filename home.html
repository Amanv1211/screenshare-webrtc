<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoCall — Start</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a3e 100%);
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%; max-width: 460px;
      backdrop-filter: blur(10px);
      text-align: center;
    }
    .logo { font-size: 2.8rem; margin-bottom: 8px; }
    h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #aaa; font-size: 0.95rem; margin-bottom: 36px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px 24px;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #eee;
    }
    .btn-outline:hover { background: rgba(255,255,255,0.08); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: #666; font-size: 0.85rem; margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 13px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; color: #eee; font-size: 0.95rem;
      outline: none; transition: border-color 0.2s;
    }
    input::placeholder { color: #666; }
    input:focus { border-color: #4f6ef7; }
    .input-row .btn { width: auto; padding: 13px 20px; white-space: nowrap; }

    /* Room link panel */
    #roomPanel {
      display: none;
      margin-top: 28px;
      background: rgba(79,110,247,0.12);
      border: 1px solid rgba(79,110,247,0.3);
      border-radius: 14px;
      padding: 20px;
      text-align: left;
    }
    #roomPanel .room-label { font-size: 0.8rem; color: #aaa; margin-bottom: 8px; }
    .link-box {
      display: flex; gap: 8px; align-items: center;
      background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px 14px;
      margin-bottom: 14px;
    }
    .link-box span { flex: 1; font-size: 0.82rem; color: #bbb; word-break: break-all; }
    .copy-btn {
      background: rgba(255,255,255,0.1); border: none; color: #eee;
      padding: 6px 12px; border-radius: 6px; font-size: 0.78rem;
      cursor: pointer; white-space: nowrap; transition: background 0.2s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.2); }
    .copy-btn.copied { background: #22c55e; color: #fff; }

    .ssl-note {
      margin-top: 28px; font-size: 0.78rem; color: #666;
      line-height: 1.5; text-align: center;
    }
    .ssl-note a { color: #4f6ef7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎥</div>
    <h1>VideoCall</h1>
    <p class="subtitle">Video &amp; audio calls with screen sharing — peer to peer</p>

    <button class="btn btn-primary" id="btnCreate">
      + &nbsp; Create New Room
    </button>

    <!-- Room link after creation -->
    <div id="roomPanel">
      <div class="room-label">Share this link with the other person:</div>
      <div class="link-box">
        <span id="shareLink">—</span>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <button class="btn btn-primary" id="btnEnter" style="margin-top:4px;">
        Enter Room →
      </button>
    </div>

    <div class="divider">or join existing</div>

    <div class="input-row">
      <input type="text" id="roomInput" placeholder="Enter room code (e.g. a3f9bc)" />
      <button class="btn btn-outline" id="btnJoin">Join</button>
    </div>

    <p class="ssl-note">
      Uses a self-signed SSL certificate. Both users must visit the link and click
      <strong>Advanced → Proceed</strong> once to allow camera &amp; mic access.
    </p>
  </div>

  <script>
    let serverHost = window.location.host; // fallback

    // Fetch local IP for shareable links
    fetch('/api/info')
      .then(r => r.json())
      .then(({ localIp, port }) => {
        if (localIp !== 'localhost') serverHost = `${localIp}:${port}`;
      })
      .catch(() => {});

    function roomUrl(roomId) {
      return `https://${serverHost}/room?session_id=${roomId}`;
    }

    document.getElementById('btnCreate').onclick = async () => {
      const { roomId } = await fetch('/api/new-room').then(r => r.json());
      const url = roomUrl(roomId);

      document.getElementById('shareLink').textContent = url;
      document.getElementById('roomPanel').style.display = 'block';
      document.getElementById('btnEnter').onclick = () => location.href = url;

      document.getElementById('copyBtn').onclick = () => {
        navigator.clipboard.writeText(url).then(() => {
          const btn = document.getElementById('copyBtn');
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
        });
      };
    };

    document.getElementById('btnJoin').onclick = () => {
      const id = document.getElementById('roomInput').value.trim();
      if (id) location.href = roomUrl(id);
    };

    document.getElementById('roomInput').onkeydown = (e) => {
      if (e.key === 'Enter') document.getElementById('btnJoin').click();
    };
  </script>
</body>
</html>
